    - Garis tinta 2 px hanya untuk perabot infografik: pin, leader, garis potong, arsir, cincin, rute.
    - Angka dibangun dari ikon (Isotype); solid masuk lewat GERAK, bukan alpha.
    - Kamera = titik dunia di tengah layar + zoom log; semua state ada di objek S yang di-tween GSAP,
      dan render() menggambar ulang kanvas dari S + tl.time() → deterministik, scrub & export presisi.
  Contoh: satu papan, 12 dtk, tanpa VO — tangki air hujan. Ganti isinya; pertahankan polanya.
  Autoplay + loop TANPA player; ?debug=1 panel scrub; ?clean=1 tahan untuk export; suara: isi src #vo.

<script>
/* ================= ENGINE ISOMETRIK =================
   Diadaptasi dari Lemo-Opuscar, styles/iso-infographic/demo/engine.js

// Isometric Infographic engine — Canvas 2D, true isometric (axes at 30°), flat 3-tone faces, no outlines.
// World: x → screen down-right, y → screen down-left, z → up.  Depth toward viewer = x + y + z.
// Usage: const iso = new Iso(ctx); iso.cam = {x,y,z,k}; iso.box(...); iso.prism(...); ...; iso.flush();
const C30 = Math.cos(Math.PI / 6), S30 = 0.5, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ss = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = (t, s = 1.7) => { t = clamp(t) - 1; return 1 + t * t * ((s + 1) * t + s); };
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- colour ----------
const _rgb = {};
function rgb(c) {
  if (typeof c !== 'string') return c;
  if (_rgb[c]) return _rgb[c];
  let h = c.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join('');
  return (_rgb[c] = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]);
}
const css = (r, a = 1) => a >= 1 ? `rgb(${r[0] | 0},${r[1] | 0},${r[2] | 0})` : `rgba(${r[0] | 0},${r[1] | 0},${r[2] | 0},${a})`;

function tri(c, lift = .2, drop = .22) { return [hex(mix(c, '#FFF7E6', lift)), hex(rgb(c)), hex(mix(c, '#231A2C', drop))]; }
const PAL = {
  red: ['#CF5140', '#B3352B', '#8C2620'],
  green: ['#7BA75F', '#5E8C4A', '#476F37'],
  blue: ['#5A9BCB', '#3C7FB1', '#2D6390'],
  cream: ['#FBF4E6', '#F2E6D0', '#D9C8A9'],
  soil: ['#A77850', '#8A5B3A', '#6A432A'],
  stone: ['#CFCABF', '#B8B2A6', '#948E83'],
  mustard: ['#E9BE5C', '#D9A53A', '#B0832A'],
  ink: '#2E2522', bg: '#F2E6D0', paper: '#FBF4E6',

// ---------- the engine ----------
class Iso {
  constructor(g, W = 1920, H = 1080) {
    this.g = g; this.W = W; this.H = H;
    this.cam = { x: 0, y: 0, z: 0, k: 10 };
    this.items = []; this.T = null; this.stack = [];
    this.desat = 0; this.keep = false; this.alpha = 1; this.seq = 0;
    this.light = [0, 0, 1];
  }
  // local transform: translate + rotate about z (+ uniform scale). Applies to every primitive.
  push(ox = 0, oy = 0, oz = 0, rot = 0, s = 1) {
    this.stack.push(this.T);
    const p = this.T, c = Math.cos(rot), sn = Math.sin(rot);
    this.T = { ox, oy, oz, c, s: sn, k: s, parent: p };
  }
  pop() { this.T = this.stack.pop(); }
  w(x, y, z) { // local → world
    let T = this.T;
    while (T) { const X = (x * T.c - y * T.s) * T.k + T.ox, Y = (x * T.s + y * T.c) * T.k + T.oy; z = z * T.k + T.oz; x = X; y = Y; T = T.parent; }
    return [x, y, z];
  }
  wn(nx, ny, nz) { let T = this.T; while (T) { const X = nx * T.c - ny * T.s, Y = nx * T.s + ny * T.c; nx = X; ny = Y; T = T.parent; } return [nx, ny, nz]; }

  P(x, y, z) { const c = this.cam, k = c.k, X = x - c.x, Y = y - c.y; return [this.W / 2 + (X - Y) * C30 * k, this.H / 2 + ((X + Y) * S30 - (z - c.z)) * k]; }

  // inverse of P on plane z
  unP(sx, sy, z = 0) { const c = this.cam, k = c.k; const u = (sx - this.W / 2) / (C30 * k), v = (sy - this.H / 2) / k + (z - c.z); const X = v + u / 2, Y = v - u / 2; return [X + c.x, Y + c.y]; }
  vis(x, y, z, r) { const [sx, sy] = this.P(x, y, z), R = r * this.cam.k * 1.2 + 4; return sx > -R && sx < this.W + R && sy > -R && sy < this.H + R; }

  col(c, a = 1) {

    if (this.desat > 0 && !this.keep) { const l = r[0] * .3 + r[1] * .55 + r[2] * .15; const gr = mix([l, l, l], '#E9DFCB', .45); r = mix(r, gr, this.desat); }

  shadeN(t3, n) { // tri + world normal → colour

  // ---- queue ----
  add(depth, fn, layer = 1) { const st = { T: this.T, keep: this.keep, alpha: this.alpha }; this.items.push({ d: depth, l: layer, s: this.seq++, fn, st }); }
  flush() {
    const it = this.items; this.items = [];
    it.sort((a, b) => a.l - b.l || a.d - b.d || a.s - b.s);
    const T0 = this.T, K0 = this.keep, A0 = this.alpha;
    for (const i of it) { this.T = i.st.T; this.keep = i.st.keep; this.alpha = i.st.alpha; i.fn(); }

  // run fn with its own sorted sub-queue (for interiors drawn between back and front walls)
  sub(fn) { const saved = this.items; this.items = []; fn(); const mine = this.items; this.items = saved; const T0 = this.T; mine.sort((a, b) => a.l - b.l || a.d - b.d || a.s - b.s); for (const i of mine) { this.T = i.st.T; this.keep = i.st.keep; this.alpha = i.st.alpha; i.fn(); } this.T = T0; }

  poly(pts, fill, a = 1) { const g = this.g; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = typeof fill === 'string' && fill.startsWith('rgb') ? fill : this.col(fill, a); g.fill(); }
  face3(pts3, t3, opt = {}) { // local 3D polygon, shaded by its normal; skips back faces unless opt.both
    const W = pts3.map(p => this.w(p[0], p[1], p[2]));
    let n = normal(W);
    if (opt.out) { const o = this.wn(opt.out[0], opt.out[1], opt.out[2]); if (n[0] * o[0] + n[1] * o[1] + n[2] * o[2] < 0) n = [-n[0], -n[1], -n[2]]; }
    if (!opt.both && n[0] + n[1] + n[2] <= 1e-6) return false;
    const c = opt.color ? opt.color : this.shadeN(t3, n[0] + n[1] + n[2] < 0 ? [-n[0], -n[1], -n[2]] : n);
    this.poly(W.map(p => this.P(p[0], p[1], p[2])), c, opt.a ?? 1); return true;
  }
  // ---- primitives (queued, auto depth) ----
  box(x, y, z, w, d, h, t3, o = {}) {
    const [cx, cy, cz] = this.w(x + w / 2, y + d / 2, z + h / 2);
    if (o.cull !== false && !this.vis(cx, cy, cz, Math.hypot(w, d, h) * (this.T ? this.scale() : 1))) return;
    this.add(cx + cy + cz + (o.bias || 0), () => this.boxNow(x, y, z, w, d, h, t3, o), o.layer ?? 1);
  }
  scale() { let k = 1, T = this.T; while (T) { k *= T.k; T = T.parent; } return k; }
  boxNow(x, y, z, w, d, h, t3, o = {}) {
    if (typeof t3 === 'string') t3 = tri(t3);
    const X = x + w, Y = y + d, Z = z + h, F = [];
    F.push([[x, y, Z], [X, y, Z], [X, Y, Z], [x, Y, Z]]);          // top
    F.push([[x, Y, z], [X, Y, z], [X, Y, Z], [x, Y, Z]]);          // +y (left)
    F.push([[X, y, z], [X, Y, z], [X, Y, Z], [X, y, Z]]);          // +x (right)
    F.push([[x, y, z], [x, y, Z], [X, y, Z], [X, y, z]]);          // -y
    F.push([[x, y, z], [x, Y, z], [x, Y, Z], [x, y, Z]]);          // -x
    // order faces far→near by their centre depth
    const order = F.map((f, i) => { const c = f.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]); const W = this.w(c[0], c[1], c[2]); return [W[0] + W[1] + W[2], i]; }).sort((a, b) => a[0] - b[0]);
    const OUT = [[0, 0, 1], [0, 1, 0], [1, 0, 0], [0, -1, 0], [-1, 0, 0]];
    for (const [, i] of order) { if (o.skip && o.skip.includes(i)) continue; this.face3(F[i], t3, { color: o.faceColor?.[i], out: OUT[i] }); }
    if (o.decal) o.decal(this, { x, y, z, w, d, h });
  }
  // extruded footprint polygon (local XY), from z to z+h
  prism(pts, z, h, t3, o = {}) {
    let cx = 0, cy = 0; pts.forEach(p => { cx += p[0] / pts.length; cy += p[1] / pts.length; });
    const W = this.w(cx, cy, z + h / 2), r = Math.max(...pts.map(p => Math.hypot(p[0] - cx, p[1] - cy)), h) * this.scale();
    if (o.cull !== false && !this.vis(W[0], W[1], W[2], r)) return;
    this.add(W[0] + W[1] + W[2] + (o.bias || 0), () => this.prismNow(pts, z, h, t3, o), o.layer ?? 1);
  }
  prismNow(pts, z, h, t3, o = {}) {
    if (typeof t3 === 'string') t3 = tri(t3);
    const n = pts.length, Z = z + h, sides = [];
    let area = 0; for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
    const sg = area >= 0 ? 1 : -1;
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; const f = [[a[0], a[1], z], [b[0], b[1], z], [b[0], b[1], Z], [a[0], a[1], Z]]; const m = this.w((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 0); sides.push([m[0] + m[1], f, [(b[1] - a[1]) * sg, -(b[0] - a[0]) * sg, 0]]); }
    sides.sort((A, B) => A[0] - B[0]);
    if (h > 0) for (const [, f, out] of sides) this.face3(f, t3, { color: o.sideColor, out });
    if (o.top !== false) this.face3(pts.map(p => [p[0], p[1], Z]), t3, { both: true, color: o.topColor });
    if (o.decal) o.decal(this);
  }
  // cylinder: vertical (axis 'z') or lying along 'x' / 'y'
  cyl(x, y, z, r, h, t3, o = {}) {
    const n = o.n || 24, axis = o.axis || 'z';
    if (axis === 'z') { const pts = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } return this.prism(pts, z, h, t3, o); }
    const [cx, cy, cz] = axis === 'x' ? [x + h / 2, y, z] : [x, y + h / 2, z];
    const W = this.w(cx, cy, cz); if (o.cull !== false && !this.vis(W[0], W[1], W[2], Math.max(r, h) * this.scale())) return;
    this.add(W[0] + W[1] + W[2] + (o.bias || 0), () => this.cylNow(x, y, z, r, h, t3, o), o.layer ?? 1);
  }
  cylNow(x, y, z, r, h, t3, o = {}) {
    if (typeof t3 === 'string') t3 = tri(t3);
    const n = o.n || 24, axis = o.axis, ring = [];
    for (let i = 0; i < n; i++) { const a = i / n * TAU + (o.spin || 0), u = Math.cos(a) * r, v = Math.sin(a) * r; ring.push(axis === 'x' ? [0, u, v] : [u, 0, v]); }
    const off = axis === 'x' ? [h, 0, 0] : [0, h, 0], base = [x, y, z];
    const A = ring.map(p => [p[0] + base[0], p[1] + base[1], p[2] + base[2]]), B = A.map(p => [p[0] + off[0], p[1] + off[1], p[2] + off[2]]);
    const sides = [];
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; const f = [A[i], A[j], B[j], B[i]]; const W = this.w((A[i][0] + B[j][0]) / 2, (A[i][1] + B[j][1]) / 2, (A[i][2] + B[j][2]) / 2); sides.push([W[0] + W[1] + W[2], f, i]); }
    sides.sort((P, Q) => P[0] - Q[0]);
    const ax = axis === 'x' ? [1, 0, 0] : [0, 1, 0];
    this.face3(A, t3, { out: [-ax[0], -ax[1], 0] });
    for (const [, f, i] of sides) this.face3(f, t3, { color: o.stripe && o.stripe(i), out: ring[i].map((v, q) => v + ring[(i + 1) % n][q]) });
    this.face3(B, t3, { color: o.capColor, out: ax });
    if (o.decal) o.decal(this);
  }
  cone(x, y, z, r, h, t3, o = {}) { // vertical cone / pyramid (n sides)
    const n = o.n || 20;
    const W = this.w(x, y, z + h / 3); if (o.cull !== false && !this.vis(W[0], W[1], W[2], Math.max(r, h) * this.scale())) return;
    this.add(W[0] + W[1] + W[2] + (o.bias || 0), () => this.coneNow(x, y, z, r, h, t3, o), o.layer ?? 1);
  }
  coneNow(x, y, z, r, h, t3, o = {}) {
    const n = o.n || 20; {
      const tt = typeof t3 === 'string' ? tri(t3) : t3, fs = [];
      for (let i = 0; i < n; i++) { const a = i / n * TAU + (o.rot || 0), b = (i + 1) / n * TAU + (o.rot || 0); const f = [[x + Math.cos(a) * r, y + Math.sin(a) * r, z], [x + Math.cos(b) * r, y + Math.sin(b) * r, z], [x, y, z + h]]; const m = this.w(x + Math.cos((a + b) / 2) * r, y + Math.sin((a + b) / 2) * r, z); fs.push([m[0] + m[1], f, [Math.cos((a + b) / 2), Math.sin((a + b) / 2), r / h]]); }
      fs.sort((A, B) => A[0] - B[0]); for (const [, f, out] of fs) this.face3(f, tt, { out });

  }
  // gable roof along x (ridge parallel to x) or y
  roof(x, y, z, w, d, h, t3, o = {}) {
    const W = this.w(x + w / 2, y + d / 2, z + h / 2); if (!this.vis(W[0], W[1], W[2], Math.hypot(w, d) * this.scale())) return;
    this.add(W[0] + W[1] + W[2] + (o.bias || 0), () => {

        this.face3([[x, y, z], [X, y, z], [m, y, Z]], o.gable || tt, { out: [0, -1, 0] }); this.face3([[X, Y, z], [x, Y, z], [m, Y, Z]], o.gable || tt, { out: [0, 1, 0] });
        this.face3([[x - ov, y - ov, z], [m, y - ov, Z], [m, Y + ov, Z], [x - ov, Y + ov, z]], tt, { out: [-1, 0, 1] }); this.face3([[m, y - ov, Z], [X + ov, y - ov, z], [X + ov, Y + ov, z], [m, Y + ov, Z]], tt, { out: [1, 0, 1] });

  // sphere: flat disc with a lit cap (upper-left) and a dark crescent (right)
  sphere(x, y, z, r, t3, o = {}) {
    const W = this.w(x, y, z); if (o.cull !== false && !this.vis(W[0], W[1], W[2], r * this.scale())) return;
    this.add(W[0] + W[1] + W[2] + (o.bias || 0), () => this.sphereNow(x, y, z, r, t3, o), o.layer ?? 1);
  }
  sphereNow(x, y, z, r, t3, o = {}) {
    if (typeof t3 === 'string') t3 = tri(t3);

  // flat polygon on plane z (ground decal); layer default 0

function sparkPath(n = 4, r = 1, inner = .28) { // n-point spark (concave star, curved-in sides approximated)
  const pts = []; for (let i = 0; i < n * 2 * 4; i++) { const a = i / (n * 8) * TAU - Math.PI / 2, k = (i % 8) / 8, tip = Math.pow(Math.abs(Math.cos(k * Math.PI)), 3); pts.push([Math.cos(a) * lerp(r * inner, r, tip), Math.sin(a) * lerp(r * inner, r, tip)]); }
  return pts;
}
function cursorPath(h = 1.6, w = .32, x = 0, y = 0) { return [[x, y - h / 2], [x + w, y - h / 2], [x + w, y + h / 2], [x, y + h / 2]]; }   // the text-cursor "tail" that follows a spark
</script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const W=1920,H=1080,DUR=12;
const cv=$('#c');cv.width=W;cv.height=H;const g=cv.getContext('2d');
const st=$('#stage');st.style.width=W+'px';st.style.height=H+'px';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();
const iso=new Iso(g,W,H);

/* ---------- palet: tanah pucat + 5–7 rona, satu rona = satu makna (ganti dari tema) ---------- */
const BG='#EDEBE3',
  K={ water:tri('#4C8FC4'), house:tri('#E2D6BF'), roof:tri('#C8553D'), grass:tri('#86AE63'), soil:tri('#9A6B47'),
      rock:tri('#A9A296'), leaf:tri('#5E9A57'), trunk:tri('#7A5236'), pipe:tri('#7F8C96') };

/* ---------- STATE: semua yang berubah di sini, di-tween GSAP; render() hanya membaca S + waktu ---------- */
const S={ cx:0, cy:0, cz:1, lk:Math.log(26),     // kamera: titik dunia di tengah + log zoom (px per unit)
  board:0, bld:0, route:0, rain:0, cut:0, skin:0, hatch:0, fill:0, pin:0, icons:0, desat:0, ring:0, title:0 };

/* ---------- pembantu: garis rute parsial & titik di sepanjang polyline (dunia) ---------- */
function polyLen(P){let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1],P[i][2]-P[i-1][2]);return L;}
function along(P,u){let rem=polyLen(P)*clamp(u);for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],l=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
  if(rem<=l){const f=l?rem/l:0;return [lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)];}rem-=l;}return P[P.length-1];}
function partial(P,u){if(u<=0)return null;const out=[P[0]];let rem=polyLen(P)*clamp(u);for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],l=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
  if(rem<l){const f=rem/l;out.push([lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]);return out;}out.push(b);rem-=l;}return out;}
/* ikon Isotype tambahan dalam bahasa tiga nada: tetes air */
function dropIcon(g,x,y,s,lit){const t=lit?K.water:['#E3DED3','#D6D0C3','#C6BFB0'];g.save();g.translate(x,y);
  g.beginPath();g.moveTo(0,-s*.46);g.bezierCurveTo(s*.1,-s*.24,s*.34,-s*.02,s*.34,s*.16);g.arc(0,s*.16,s*.34,0,Math.PI);g.bezierCurveTo(-s*.34,-s*.02,-s*.1,-s*.24,0,-s*.46);g.fillStyle=t[1];g.fill();
  g.save();g.clip();g.beginPath();g.arc(s*.2,s*.22,s*.34,0,TAU);g.fillStyle=t[2];g.fill();g.beginPath();g.ellipse(-s*.1,-s*.04,s*.12,s*.18,-.4,0,TAU);g.fillStyle=t[0];g.fill();g.restore();g.restore();}

/* ---------- dunia (koordinat dunia: x kanan-bawah, y kiri-bawah, z naik) ---------- */
const B=10;                                           // papan 20×20
const HX0=-4,HX1=2,HY0=-3,HY1=2,HH=3.6,WT=.3;         // rumah
const TANK=[-1.4,-.6],TR=1.05,TH=2.6;                 // tangki di dalam rumah
const PIPE=[[2.3,1.6,HH+.35],[2.3,1.6,HH-.5],[TANK[0],1.6,HH-.5],[TANK[0],TANK[1],HH-.5],[TANK[0],TANK[1],TH+.15]];
const TREES=[[6.5,-6.5,1.2],[-7,6,1],[7.4,5.2,.9],[-7.2,-5.6,1.1]];

function drawWorld(t){
  const zB=-16*(1-S.board);                          // papan jatuh masuk (gerak, bukan alpha)
  iso.push(0,0,zB);
  // papan + strata di tepinya
  iso.box(-B,-B,-3.2,2*B,2*B,1.4,K.rock,{layer:0});   // papan di layer 0: benda raksasa merusak urutan painter
  iso.box(-B,-B,-1.8,2*B,2*B,1.45,K.soil,{layer:0});
  iso.box(-B,-B,-.35,2*B,2*B,.35,K.grass,{layer:0});
  // pohon: muncul memantul per pohon
  TREES.forEach(([x,y,s],i)=>{const a=back(seg(S.bld,.1+i*.12,.5+i*.12),2);if(a<=0)return;
    iso.push(x,y,0,0,s*a);iso.cyl(0,0,0,.22,1.1,K.trunk,{n:10});iso.cone(0,0,1,1.1,2.4,K.leaf,{n:7,rot:.3});iso.pop();});
  // rumah: jatuh dari atas, lalu kulit depan (+y) dipotong
  const zH=9*(1-eo(seg(S.bld,0,.7)));
  iso.push(0,0,zH);
  iso.flat([[HX0,HY0],[HX1,HY0],[HX1,HY1],[HX0,HY1]],.01,'#CFC6B3',{layer:0,depth:1e3});
  iso.box(HX0,HY0,0,HX1-HX0,WT,HH,K.house);                 // dinding belakang (-y)
  iso.box(HX0,HY0,0,WT,HY1-HY0,HH,K.house);                 // dinding kiri (-x)
  iso.box(HX1-WT,HY0,0,WT,HY1-HY0,HH,K.house,{decal:(I)=>{  // dinding kanan (+x) + jendela
    I.face3([[HX1+.001,-1.6,1.4],[HX1+.001,-.2,1.4],[HX1+.001,-.2,2.6],[HX1+.001,-1.6,2.6]],K.water,{both:true,color:K.water[2]});}});
  if(S.skin<1){iso.alpha=1-S.skin;iso.roof(HX0-.1,HY0-.1,HH+S.skin*7,HX1-HX0+.2,HY1-HY0+.2,1.6,K.roof,{ridge:'x',over:.25,gable:K.house});iso.alpha=1;}  // atap terangkat bersama kulit
  if(S.skin<1){iso.alpha=1-S.skin;iso.box(HX0,HY1-WT+S.skin*5,0,HX1-HX0,WT,HH,K.house,{decal:(I)=>{
      I.face3([[-1.2,HY1+S.skin*5+.001,0],[.2,HY1+S.skin*5+.001,0],[.2,HY1+S.skin*5+.001,2.2],[-1.2,HY1+S.skin*5+.001,2.2]],K.roof,{both:true,color:K.roof[1]});}});iso.alpha=1;}
  // tangki: garis kapasitas putus-putus + air (solid) yang naik
  if(S.skin>.5){iso.keep=true;
    if(S.fill>0)iso.cyl(TANK[0],TANK[1],0,TR*.94,TH*S.fill,K.water,{n:28});
    const ell=z=>{const P=[];for(let i=0;i<=28;i++){const a=i/28*TAU;P.push([TANK[0]+Math.cos(a)*TR,TANK[1]+Math.sin(a)*TR,z]);}return P;};
    iso.line3(ell(TH),PAL.ink,2,{dash:[6,6],bias:6});iso.line3(ell(0),PAL.ink,2,{dash:[6,6],bias:-6});
    iso.keep=false;}
  // hatch di ujung potongan dinding samping
  if(S.hatch>0)for(const xw of [HX0,HX1-WT]){const F=[[xw,HY1,0],[xw+WT,HY1,0],[xw+WT,HY1,HH],[xw,HY1,HH]];
    iso.add(xw+WT/2+HY1+HH/2+.6,()=>{iso.g.save();iso.g.globalAlpha=S.hatch;hatch(iso.g,F.map(p=>iso.L(...p)));iso.g.restore();});}
  // pipa talang + rute tinta yang digambar sedikit di depan airnya
  iso.line3(PIPE.slice(0,3),K.pipe[2],.32,{world:true,cap:'butt',bias:5});
  const r=partial(PIPE,S.route);if(r)iso.line3(r,PAL.ink,2.5,{dash:[10,7],off:-t*30,bias:8});
  if(S.rain>0&&S.fill<1)for(let i=0;i<5;i++){const p=along(PIPE,((t*.55+i/5)%1));iso.sphere(p[0],p[1],p[2],.16,K.water,{bias:9});}
  iso.pop();
  // orang: billboard, melangkah 12 fps ketika air naik
  const step=Math.floor(t*12)%2;
  iso.bill(4.6,3.4,0,(g)=>person(g,{body:'#3C6E8F',hat:'cap',hatColor:'#C8553D',h:1.9,arm:-.9-step*.12,face:-1}),{r:2});
  // judul isometrik di permukaan papan
  if(S.title>0)iso.text3('AIR HUJAN',8.4,-1.2,.02,{plane:'xy',size:1.5,extrude:.25*S.title,tri:PAL.cream,face:'#2E2522',weight:600,track:6});
  iso.pop();
}

function rain(t){ // hujan: garis tinta tipis, posisi dari hash → deterministik
  if(S.rain<=0)return;g.save();g.strokeStyle=`rgba(76,143,196,${.55*S.rain})`;g.lineWidth=2;g.lineCap='round';g.beginPath();
  for(let i=0;i<70;i++){const x=(hash(i)*2-1)*B,y=(hash(i+99)*2-1)*B,z=14-((t*9+hash(i+7)*14)%14);const a=iso.P(x,y,z+1),b=iso.P(x,y,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}
  g.stroke();g.restore();}

function render(){
  const t=tl.time();
  iso.cam={x:S.cx,y:S.cy,z:S.cz,k:Math.exp(S.lk)};
  g.setTransform(1,0,0,1,0,0);g.fillStyle=BG;g.fillRect(0,0,W,H);
  // kisi titik isometrik di tanah (ikut kamera → latar ikut bergerak)
  g.fillStyle='rgba(46,37,34,.13)';for(let i=-30;i<=30;i+=2)for(let j=-30;j<=30;j+=2){const p=iso.P(i,j,-6);if(p[0]>-5&&p[0]<W+5&&p[1]>-5&&p[1]<H+5){g.beginPath();g.arc(p[0],p[1],1.8,0,TAU);g.fill();}}
  // bayangan lembut papan
  const sp=iso.P(0,0,-3.2-16*(1-S.board)-1.4),kk=iso.cam.k,gr=g.createRadialGradient(sp[0],sp[1],0,sp[0],sp[1],B*kk*1.5);
  gr.addColorStop(0,'rgba(46,37,34,.22)');gr.addColorStop(1,'rgba(46,37,34,0)');g.fillStyle=gr;g.beginPath();g.ellipse(sp[0],sp[1],B*kk*1.5,B*kk*.8,0,0,TAU);g.fill();
  iso.desat=S.desat;drawWorld(t);iso.flush();iso.desat=0;
  rain(t);
  // garis potong digambar SEBELUM kulit bergeser
  if(S.cut>0&&S.skin<.4){const z=9*(1-eo(seg(S.bld,0,.7)));cutLine(g,[[HX0,HY1,0],[HX1,HY1,0],[HX1,HY1,HH],[HX0,HY1,HH],[HX0,HY1,0]].map(p=>iso.P(p[0],p[1],p[2]+z)),S.cut);}
  // pin + Isotype: 1 tetes = 120 L
  if(S.pin>0){const n=Math.round(S.icons*10);
    pin(iso,TANK[0],TANK[1],TH*S.fill,{a:S.pin,title:'TANGKI',num:(n*120).toLocaleString('id-ID'),unit:'LITER',dir:-1,up:220,len:80,
      icons:(gg,x,y,dir)=>iconGrid(gg,x-10*40,y,10,S.icons*10,10,40,(c,px,py,s,lit)=>dropIcon(c,px,py,s,lit))});}
  // cincin "di sini" saat menarik mundur
  if(S.ring>0){const p=iso.P((HX0+HX1)/2,(HY0+HY1)/2,HH*.6);ring(g,p[0],p[1],iso.cam.k*5.2,S.ring,t,'RUMAH INI');}
}

/* ================= KOREOGRAFI (contoh 12 dtk; saat dipakai, kunci ke kata VO) ================= */
const tl=gsap.timeline({paused:true,onUpdate:render});
const to=(at,dur,vars,ease='power2.inOut')=>tl.to(S,{...vars,duration:dur,ease},at);
to(0,1.1,{board:1},'back.out(1.3)');                          // papan mendarat
to(.2,1.4,{lk:Math.log(30)},'sine.inOut');
to(.7,1.6,{bld:1},'none');                                    // rumah & pohon masuk
to(1.6,.8,{title:1},'power2.out');
to(2.3,.9,{rain:1},'power1.out');to(2.5,1.4,{route:1},'power2.inOut');   // rute tinta mendahului air
to(3.0,1.8,{cx:-1,cy:0,cz:1.6,lk:Math.log(72)});              // dorong ke rumah (log zoom)
to(3.6,.35,{cut:1},'none');                                   // garis potong
to(4.0,.4,{skin:1},'power2.out');to(4.25,.3,{hatch:1},'power1.out');   // kulit lepas, arsir muncul
to(4.6,3.6,{fill:1},'sine.inOut');                            // air naik
to(5.4,1.2,{pin:1},'none');to(5.9,2.3,{icons:1},'none');      // pin, lalu angka dibangun dari ikon
to(6.0,.8,{desat:.85},'power1.out');                          // fokus + konteks
to(8.6,.6,{desat:0,rain:0},'power1.in');
to(8.8,2.0,{cx:0,cy:0,cz:0,lk:Math.log(27),pin:1},'power3.inOut');      // tarik mundur cepat
to(9.6,.8,{ring:1},'power2.out');
tl.to({},{duration:.01},DUR);

/* ---------- kontrol: autoplay + loop tanpa player; ?debug=1 panel; ?clean=1 export ---------- */
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
tl.eventCallback('onComplete',()=>start());
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);render();},play:start};
window.OPENER.seekFrame=t=>{window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);render();});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
Promise.all([document.fonts.load('600 25px Jost'),document.fonts.load('400 44px Jost')]).then(()=>document.fonts.ready).then(()=>{render();window.OPENER.ready=true;if(q.has('clean'))return;if(!hasVO){start();return;}
  vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
</script>
</body>
